name: pdf-extractext

# Infraestructura de PDF Extractext.
# Arquitectura: Traefik -> API -> {Extraction, Persistence} -> MongoDB.
# Decisiones: docs/architecture-decisions.md

services:
  traefik:
    image: traefik:v3
    # TLS local con mkcert (D1-D2): :80 redirige a :443; entrypoint interno
    # :8090 solo red, no publicado (tráfico servicio→servicio, D3).
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - services

  api:
    build: ${API_CONTEXT:?API_CONTEXT no definido — copiá .env.example a .env y ajustá la ruta al repo de API}
    image: pdf-extractext-api:${API_TAG:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000" # entrypoint público vía Traefik; no se publica al host
    environment:
      # EXTRACTION_URL apunta al entrypoint interno :8090 de Traefik (D3):
      # ahí Traefik balancea las réplicas de Extraction (D9).
      EXTRACTION_URL: http://traefik:8090
      PERSISTENCE_URL: http://persistence:8002
      MAX_FILE_SIZE_MB: "50"
    depends_on:
      - traefik
      - persistence
    # Entrypoint público (D15): HTTPS con mkcert. El redirect 80→443 ya es
    # global en la config estática (traefik.yml), no requiere router extra.
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`pdf-extractext.localhost`)
      - traefik.http.routers.api.entrypoints=https
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=8000
    networks:
      - services # sin acceso a `data` (solo Persistence habla con MongoDB)

  extraction:
    build: ${EXTRACTION_CONTEXT:?EXTRACTION_CONTEXT no definido — copiá .env.example a .env y ajustá la ruta al repo de Extraction}
    image: pdf-extractext-extraction:${EXTRACTION_TAG:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8001" # solo red interna
    # Router interno (entrypoint :8090, no público): Traefik balancea réplicas (D3).
    labels:
      - traefik.enable=true
      - traefik.http.routers.extraction.rule=Host(`extraction.pdf-extractext.localhost`)
      - traefik.http.routers.extraction.entrypoints=internal
      - traefik.http.services.extraction.loadbalancer.server.port=8001
    deploy:
      replicas: 1 # TP admite hasta 5; Traefik balancea (D3/D9)
      resources:
        limits: # exigencia del TP (D9)
          cpus: "1.0"
          memory: 1G
    networks:
      - services

  persistence:
    build: ${PERSISTENCE_CONTEXT:?PERSISTENCE_CONTEXT no definido — copiá .env.example a .env y ajustá la ruta al repo de Persistence}
    image: pdf-extractext-persistence:${PERSISTENCE_TAG:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8002" # solo red interna
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - services
      - data # único servicio con acceso a MongoDB

  mongodb:
    image: ${MONGO_IMAGE:?MONGO_IMAGE no definido — copiá .env.example a .env}
    # Solo Persistence accede a MongoDB. 27017 no se publica al host.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Falta en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Falta en .env}
    volumes:
      - mongo_data:/data/db # volumen nombrado; jamás bind-mount versionado
    networks:
      - data
    # Healthcheck técnico del contenedor; el health/readiness de los
    # microservicios es pendiente de equipo.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  services: # Traefik, API, Extraction, Persistence
  data:     # MongoDB y quienes acceden a sus datos (Persistence)

volumes:
  mongo_data:
    name: pdf-extractext-mongo-data
