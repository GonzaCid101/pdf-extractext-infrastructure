name: pdf-extractext

# Infraestructura de PDF Extractext.

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      # :8090 no se publica al host (D3): solo tráfico interno en `services`.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - services

  api:
    build: ${API_CONTEXT:-../pdf-extractext-api}
    image: pdf-extractext-api:${API_TAG:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000" # entrypoint público vía Traefik; no se publica al host
    environment:
      EXTRACTION_URL: ${EXTRACTION_URL:-http://traefik:8090}
      PERSISTENCE_URL: ${PERSISTENCE_URL:-http://persistence:8002}
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-16}"
    deploy:
      resources:
        limits: # tope del TP
          cpus: "1.0"
          memory: 512M
    healthcheck:
      # Exec sin shell: la imagen distroless no tiene curl/wget.
      test: ["CMD", "/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      extraction:
        condition: service_healthy
      persistence:
        condition: service_healthy
      traefik:
        condition: service_started 
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`pdf-extractext.localhost`)
      - traefik.http.routers.api.entrypoints=https
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=8000
    networks:
      - services

  extraction:
    build: ${EXTRACTION_CONTEXT:-../pdf-extractext-extractor}
    image: pdf-extractext-extraction:${EXTRACTION_TAG:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8001" # solo red interna
    environment:
      WEB_CONCURRENCY: ${EXTRACTION_WORKERS:-1}
      MAX_CONCURRENCY: ${EXTRACTION_MAX_CONCURRENCY:-1}
      RETRY_AFTER_SECONDS: ${EXTRACTION_RETRY_AFTER_SECONDS:-1}
    labels:
      - traefik.enable=true
      - traefik.http.routers.extraction.rule=Host(`extraction.pdf-extractext.localhost`)
      - traefik.http.routers.extraction.entrypoints=internal
      - traefik.http.services.extraction.loadbalancer.server.port=8001
    deploy:
      replicas: ${EXTRACTION_REPLICAS:-1}
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - services
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  persistence:
    build: ${PERSISTENCE_CONTEXT:-../pdf-extractext-persistence}
    image: pdf-extractext-persistence:${PERSISTENCE_TAG:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8002" # solo red interna
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-dev}:${MONGO_INITDB_ROOT_PASSWORD:-dev}@mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits: # tope del TP
          cpus: "1.0"
          memory: 512M
    networks:
      - services
      - data # único servicio con acceso a MongoDB
    healthcheck:
      test: ["CMD", "/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongodb:
    image: ${MONGO_IMAGE:-mongo:8}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-dev}
    deploy:
      resources:
        limits: 
          cpus: "1.0"
          memory: 1G
    volumes:
      - mongo_data:/data/db
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  services: # Traefik, API, Extraction, Persistence
  data:     # MongoDB y quienes acceden a sus datos (Persistence)

volumes:
  mongo_data:
    name: pdf-extractext-mongo-data
