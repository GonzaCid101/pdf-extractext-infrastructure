name: pdf-extractext

# Infraestructura de PDF Extractext.

services:
  consul:
    image: hashicorp/consul:2.0.4@sha256:1c59f007df8ea1c21b2558dc73ef8d99047bc895d9e52e635d1e745e35fe9a54
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/consul/entrypoint.sh"]
    environment:
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:?falta CONSUL_HTTP_TOKEN en .env}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - ./consul/config:/consul/config:ro
      - ./consul/entrypoint.sh:/consul/entrypoint.sh:ro
      - consul_data:/consul/data
    networks:
      - services
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.consul.rule=Host(`consul.pdf-extractext.localhost`)
      - traefik.http.routers.consul.entrypoints=internal
      - traefik.http.services.consul.loadbalancer.server.port=8500

  consul-seed:
    image: hashicorp/consul:2.0.4@sha256:1c59f007df8ea1c21b2558dc73ef8d99047bc895d9e52e635d1e745e35fe9a54
    restart: "no"
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/consul/seed/seed.sh"]
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:?falta CONSUL_HTTP_TOKEN en .env}
      SEED_FORCE: ${SEED_FORCE:-false}
    volumes:
      - ./consul/seed:/consul/seed:ro
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - services

  traefik:
    image: traefik:v3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      # :8090 no se publica al host (D3): solo tráfico interno en `services`.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TRAEFIK_PROVIDERS_CONSULCATALOG_ENDPOINT_TOKEN: ${CONSUL_HTTP_TOKEN:?falta CONSUL_HTTP_TOKEN en .env}
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - services

  api:
    build: ${API_CONTEXT:-../pdf-extractext-api}
    image: pdf-extractext-api:${API_TAG:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000" # entrypoint público vía Traefik; no se publica al host
    environment:
      CONSUL_HTTP_ADDR: "consul:8500"
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:?falta CONSUL_HTTP_TOKEN en .env}
      CONSUL_ENABLED: "true"
      SERVICE_NAME: api
      SERVICE_PORT: "8000"
      SERVICE_HEALTH_PATH: /
    deploy:
      resources:
        limits: # tope del TP
          cpus: "1.0"
          memory: 512M
    # > shutdown de 10s de la API + 5s de deregistro: drena requests antes del SIGKILL.
    stop_grace_period: 20s
    healthcheck:
      # Exec sin shell: la imagen distroless no tiene curl/wget.
      test: ["CMD", "/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      extraction:
        condition: service_healthy
      persistence:
        condition: service_healthy
      traefik:
        condition: service_started 
      consul-seed:
        condition: service_completed_successfully
    networks:
      - services

  extraction:
    build: ${EXTRACTION_CONTEXT:-../pdf-extractext-extractor}
    image: pdf-extractext-extraction:${EXTRACTION_TAG:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8001" # solo red interna
    environment:
      WEB_CONCURRENCY: ${EXTRACTION_WORKERS:-1}
      CONSUL_HTTP_ADDR: "consul:8500"
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:?falta CONSUL_HTTP_TOKEN en .env}
      CONSUL_ENABLED: "true"
      SERVICE_NAME: extraction
      SERVICE_PORT: "8001"
      SERVICE_HEALTH_PATH: /readyz
    deploy:
      replicas: ${EXTRACTION_REPLICAS:-1}
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    # > graceful_timeout de gunicorn (30s) + 5s de deregistro: drena la extracción en curso.
    stop_grace_period: 35s
    depends_on:
      consul-seed:
        condition: service_completed_successfully
    networks:
      - services
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  persistence:
    build: ${PERSISTENCE_CONTEXT:-../pdf-extractext-persistence}
    image: pdf-extractext-persistence:${PERSISTENCE_TAG:-dev}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8002" # solo red interna
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-dev}:${MONGO_INITDB_ROOT_PASSWORD:-dev}@mongodb:27017
      CONSUL_HTTP_ADDR: "consul:8500"
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:?falta CONSUL_HTTP_TOKEN en .env}
      CONSUL_ENABLED: "true"
      SERVICE_NAME: persistence
      SERVICE_PORT: "8002"
      SERVICE_HEALTH_PATH: /health/ready
    depends_on:
      mongodb:
        condition: service_healthy
      consul-seed:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: # tope del TP
          cpus: "1.0"
          memory: 512M
    # > shutdown de 10s + 5s de deregistro: drena requests y cierra MongoDB limpio.
    stop_grace_period: 20s
    networks:
      - services
      - data # único servicio con acceso a MongoDB
    healthcheck:
      test: ["CMD", "/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongodb:
    image: ${MONGO_IMAGE:-mongo:8}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-dev}
    deploy:
      resources:
        limits: 
          cpus: "1.0"
          memory: 1G
    volumes:
      - mongo_data:/data/db
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME:-dev}", "-p", "${MONGO_INITDB_ROOT_PASSWORD:-dev}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  services: # Traefik, API, Extraction, Persistence
  data:     # MongoDB y quienes acceden a sus datos (Persistence)

volumes:
  mongo_data:
    name: pdf-extractext-mongo-data
  consul_data:
    name: pdf-extractext-consul-data
